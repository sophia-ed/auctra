# Auctra deployment (AUCTRA.md Sections 81, 103).
#
# Single public entry point: only `web` publishes a port. `/api/*` is proxied by
# the Next server to the `api` service, so there is no CORS and one domain is
# enough. Mainnet remains gated by ENABLE_MAINNET.

x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
      API_INTERNAL_URL: http://api:3001
  image: auctra:app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auctra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auctra}
      POSTGRES_DB: ${POSTGRES_DB:-auctra}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/sql/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    expose:
      - '5432'
    healthcheck:
      # Use the container's own POSTGRES_USER/POSTGRES_DB and give first-boot
      # initdb time before failures count.
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  api:
    <<: *app
    command: pnpm --filter @auctra/api start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auctra}:${POSTGRES_PASSWORD:-auctra}@postgres:5432/${POSTGRES_DB:-auctra}
      DEMO_MODE: ${DEMO_MODE:-true}
      ENABLE_MAINNET: ${ENABLE_MAINNET:-false}
      PRESTOCKS_API_URL: ${PRESTOCKS_API_URL:-https://prestocks.com/api/prestocks}
      PYTH_HERMES_URL: ${PYTH_HERMES_URL:-https://hermes.pyth.network}
      PYTH_API_KEY: ${PYTH_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      PORT: '3001'
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *app
    command: pnpm --filter @auctra/worker start
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-auctra}:${POSTGRES_PASSWORD:-auctra}@postgres:5432/${POSTGRES_DB:-auctra}
      DEMO_MODE: ${DEMO_MODE:-true}
      PRESTOCKS_API_URL: ${PRESTOCKS_API_URL:-https://prestocks.com/api/prestocks}
      PYTH_HERMES_URL: ${PYTH_HERMES_URL:-https://hermes.pyth.network}
      PYTH_API_KEY: ${PYTH_API_KEY:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *app
    command: pnpm --filter @auctra/web start
    environment:
      # Empty => same-origin; the Next server proxies /api/* to API_INTERNAL_URL.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
